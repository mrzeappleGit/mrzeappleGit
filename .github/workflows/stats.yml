name: Refresh profile stats

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - run: node --test scripts/update-stats.test.mjs
      - run: node scripts/update-stats.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save updated stats
        run: |
          git diff --quiet -- README.md && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Refresh public GitHub stats'
          git push origin HEAD:main
